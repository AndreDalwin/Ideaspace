name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    name: verify desktop stack
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run desktop-stack verification
        run: bun run verify:desktop

  required:
    name: test (linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - verify
    if: always()
    steps:
      - name: Verify upstream test jobs passed
        run: |
          echo "verify=${{ needs.verify.result }}"
          test "${{ needs.verify.result }}" = "success"
